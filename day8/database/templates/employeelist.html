<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>employee list</title>
</head>
<body>
    <div>
        <h1>Employee List</h1>
        <table border="1">
            <tr>
                <th>id</th>
                <th>Employee Number</th>
                <th>Employee Name</th>
                <th>Employee Salary</th>
            </tr>
            {% for emp in employees %}
            <tr> <td><a href="http://localhost:8000/database/updateEmployeeform/?id={{employee.id}}">{{i.id}}</a></td>
                <td>{{emp.id}}</td>
                <td>{{ emp.eno }}</td>
                <td>{{ emp.ename }}</td>
                <td>{{ emp.esal }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
    
</body>
</html>
